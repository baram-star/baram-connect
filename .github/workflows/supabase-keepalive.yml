# Supabase 무료 플랜 자동 일시정지 방지
# 무료 플랜은 7일 동안 활동이 없으면 프로젝트를 멈춘다.
# 공지(notices) 1건을 읽는 요청을 주 2회 보내 활동 기록을 남긴다.
# 키는 app.js에 이미 공개된 publishable(읽기용) 키와 같다.
name: Supabase keepalive

on:
  schedule:
    # 매주 월·목 오전 9시(한국 시간) = 00:00 UTC
    - cron: "0 0 * * 1,4"
  workflow_dispatch: {} # Actions 탭에서 직접 실행할 때

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: notices 1건 읽기
        env:
          SUPABASE_URL: https://fgwuzbdopprzlkiyjhkm.supabase.co
          SUPABASE_KEY: sb_publishable_P9Nu1-xc7cdMDJ55MNHDUA_GHAVHdZd
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/notices?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          test "$code" = "200"
